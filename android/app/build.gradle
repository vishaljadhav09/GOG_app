import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------------------------------------
// Version
//   versionName : -PversionName=1.2.3   >  "version" in ../package.json (single place to bump; CI checks the
//                 git tag vX.Y.Z against it).
//   versionCode : -PversionCode=N       >  env GITHUB_RUN_NUMBER (CI: always increasing, so every tagged build
//                 is a valid Play upload)  >  1 (local builds; fine for sideloading, NOT for a second Play upload).
//   If the workflow is ever recreated (run numbers restart) pass -PversionCode=<higher than the last upload>.
// ---------------------------------------------------------------------------------------------------------
def packageJson = new JsonSlurper().parse(rootProject.file('../package.json'))
def appVersionName = (project.findProperty('versionName') ?: packageJson.version).toString()
def appVersionCode = (project.findProperty('versionCode') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1').toString().toInteger()

// Release signing: credentials come only from the environment (set as GitHub Actions secrets in CI).
// Debug builds never need them. Building a RELEASE (assembleRelease / bundleRelease) without the keystore
// FAILS (see the taskGraph check below) instead of silently producing an unsigned file that Play rejects.
// Escape hatch for local experiments (e.g. testing R8): -PallowUnsignedRelease
def releaseKeystore = file(System.getenv("KEYSTORE_PATH") ?: "release.jks") // relative to android/app

android {
    namespace = "com.gog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.gog.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
            // R8 code shrinking / resource shrinking is OFF by default: it could not be validated on a
            // machine with an Android SDK when this was written (the app has ~1 Java class, so the gain is
            // small). To test it: ./gradlew assembleRelease -Pminify=true -PallowUnsignedRelease, run the
            // APK on a device (touch, audio, Back button), then flip the default here.
            def minify = project.findProperty('minify')?.toString() == 'true'
            minifyEnabled minify
            shrinkResources minify
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Play serves split APKs per device: split by screen density and ABI, but not by language (single-language
    // game: keeps every string in the base split).
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

// Fail fast, with a readable message, when a release artifact is requested without signing credentials.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.project == project && it.name ==~ /^(assemble|bundle|package)Release(Bundle)?$/ }
    if (releaseRequested && !project.hasProperty('allowUnsignedRelease')) {
        if (!releaseKeystore.exists()) {
            throw new GradleException(
                "Release build requested but the upload keystore was not found at '${releaseKeystore}'.\n" +
                "Set KEYSTORE_PATH (or place the file at android/app/release.jks) together with KEYSTORE_PASSWORD, " +
                "KEY_ALIAS and KEY_PASSWORD. In CI these come from the repo secrets (see README.md > Release).\n" +
                "Debug builds (assembleDebug) do not need a keystore. For a throw-away unsigned test build use -PallowUnsignedRelease.")
        }
        ['KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].each { name ->
            if (!System.getenv(name)) {
                throw new GradleException("Release build requested but environment variable ${name} is empty or not set.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
